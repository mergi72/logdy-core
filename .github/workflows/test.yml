name: Go Tests

on:
  push:
    branches: [ main, vfs-platform ]
  pull_request:
    branches: [ main, vfs-platform ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.2'
        
    - name: Install dependencies
      run: go mod download
        
    - name: Run tests
      run: go test -count=1 ./...

    - name: Vet
      run: go vet ./...

    - name: Race detector (stable concurrency coverage)
      run: go test -race -count=1 ./http -run 'TestSessionAuth|TestSameHostOrigin|TestConfigSave|TestClientID|TestClientJoinSingle|TestClientJoinMultiple'
